# Render's free plan puts the API to sleep after 15 idle minutes, and the next
# visitor then waits 30–60 s for it to wake. Pinging it every 10 minutes keeps it awake.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://duhita-dental-api.onrender.com/api/health
