# Render Blueprint — the clinic API and Duhita AI's voice server.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: duhita-dental-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore            # closest Render region to Vijayawada
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI              # paste your Atlas connection string when prompted
        sync: false
      - key: MONGO_DB
        value: duhita_dental
      - key: ADMIN_USERNAME
        value: DuhitaAdmin
      - key: ADMIN_PASSWORD         # choose a strong password when prompted
        sync: false
      - key: JWT_SECRET
        generateValue: true         # Render creates a long random secret for you
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: CORS_ORIGINS           # your Vercel URL, e.g. https://duhita-dental.vercel.app
        sync: false
      - key: CORS_ORIGIN_REGEX      # lets Vercel preview deployments call the API too
        value: ^https://duhita-dental(-[a-z0-9-]+)?\.vercel\.app$
      - key: CLOUDINARY_URL         # optional: cloudinary://<key>:<secret>@<cloud> — fast, compressed feedback videos
        sync: false

  # Duhita AI — speech-to-text, replies and the talking avatar the app shows.
  - type: web
    name: duhita-ai
    runtime: node
    rootDir: ai-server
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY         # free key from https://aistudio.google.com/apikey
        sync: false
      - key: GROQ_API_KEY           # free key from https://console.groq.com/keys — voice-to-text
        sync: false
      - key: OPENROUTER_API_KEY     # optional backup
        sync: false
      - key: APP_TOKEN              # shared secret; same value as EXPO_PUBLIC_APP_TOKEN in the app
        sync: false
      - key: CLINIC_NAME
        value: Duhita Multispeciality Dental Centre
      - key: CLINIC_CITY
        value: Vijayawada
