# Cache policy per path. One server-level add_header uses it, because an add_header inside a
# location would silently drop the security headers below for that location.
map $uri $cache_control {
    ~^/assets/                                  "public, max-age=31536000, immutable";  # fingerprinted, never change
    ~^/images/                                  "public, max-age=604800, stale-while-revalidate=86400";
    ~^/(robots\.txt|sitemap\.xml|llms\.txt)$    "public, max-age=86400";
    default                                     "no-cache";  # HTML: always revalidate so a deploy shows at once
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: TLS ends at the proxy, so nginx would otherwise send http:// URLs.
    absolute_redirect off;

    # One host for search engines: www.duhitadental.com → duhitadental.com
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Gzip the text-based assets Vite ships.
    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location = /robots.txt  { default_type text/plain; try_files $uri =404; }
    location = /llms.txt    { default_type text/plain; charset utf-8; try_files $uri =404; }
    location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }

    # Old URL kept working for anyone who linked to it.
    location = /services/community-service { return 301 /services/community-dentistry; }

    # Client-only routes (dashboard, patient account): the empty noindex shell, React renders them.
    location ~ ^/(admin|account)(/|$) {
        try_files /spa.html =404;
    }

    # Public pages are prerendered to <route>/index.html at build time (scripts/prerender.mjs).
    # Anything else is a real 404 — with the prerendered "page not found" page, not a soft 200.
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
